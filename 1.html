<body style="margin: 0; padding: 10px; font-family: sans-serif;">
  <h2>1. 기본회원</h2>
  <h3>
  <pre style="white-space: pre-wrap; font-family: inherit; word-break: break-all; margin: 0; line-height: 1.6; color: #333; font-size: 15px;">
1-1) 본인인증을 거쳐 단 한번 뜻에 따라 등록
      기본자산(일십만코바)을 가진다.

1-2) 등록은 본인인증코드,생년월일,전화번호
      제공으로 등록되며 생후 100년 유효하다

1-3) 만 18세부터 매년 이천코바를 누적 받아
      (주기, 팔기)로 사용할 수 있다.

1-4) 기본코바는 보유세가 없고 받은코바는
      년 1%의 보유세가 있다.

1-5) 기본회원의 최대 보유량은 천만코바이다.
  </pre>
  </h3>
