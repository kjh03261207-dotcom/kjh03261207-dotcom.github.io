  <h2>5. 기타</h2>
  <h3>
  <pre style="white-space: pre-wrap; font-family: inherit; word-break: break-all; margin: 0; line-height: 1.6; color: #333; font-size: 15px;">
6-1) ACE는 등록수수료와 기부금으로
      운영된다.

6-2) 기본회원 등록수수료는 1코바 또는
      일만원을 ACE 에게 지불한다.

6-3) 기타회원 등록수수료는 일백만원을
      ACE 에게 지불한다.

6-4) ACE의 이익은 전액 가상정부에
       환원 코바유지에 사용한다
  </pre>
  </h3>
