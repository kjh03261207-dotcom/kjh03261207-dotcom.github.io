  <h2>4. 코바의 발행</h2>
  <h3>
  <pre style="white-space: pre-wrap; font-family: inherit; word-break: break-all; margin: 0; line-height: 1.6; color: #333; font-size: 15px;">
4-1) 코바의 발행 총수는 매년말 기준 
      (기본회원수 * 100코바) 이다.

4-2) 기본회원의 생년 기준 101년째에 남은 
     잉여코바는 가상정부의 소유가 된다.

4-3) 기본회원의 기본코바는 세금 제외이다.
  </pre>
  </h3>
