  <h2>4. 코바의 유지</h2>

4-1) 가상정부는 부가세,보유세,잉여코바로
      매년말 기준 (기본회원수 * 100코바)

4-2) 코바유지에 가감이 발생되면 2차 
      일정비율 가감하여 기준을 유지한다.

4-3) 이 때 받은 기본코바는 제외한다.
