<body style="margin: 0; padding: 10px; font-family: sans-serif;">
  <h2>5. 코바의 유지</h2>
  <h3>
  <pre style="white-space: pre-wrap; font-family: inherit; word-break: break-all; margin: 0; line-height: 1.6; color: #333; font-size: 15px;">
5-1) 가상정부는 (기본회원수*일만코바) =
      일정코바를 매년말 유지한다.

5-2) 가상정부는 부가세,보유세,잉여코바를
      징수하여 일정코바를 유지한다.

5-3) 코바유지에 증가가 발생되면 보유코바 
      소각으로 1차 유지를 조정하고

5-4) 그래도 증가시 일정비율로 회원보유
      코바를 소각하여 유지한다.

5-5) 단 기본코바는 소각에서 제외한다.
 </pre>
  </h3>
</body>
