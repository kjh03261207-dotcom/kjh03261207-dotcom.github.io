  <h2><b>2. 기타회원</b></h2>
  <h3>
  <pre style="white-space: pre-wrap; font-family: inherit; word-break: break-all; margin: 0; line-height: 1.6; color: #333; font-size: 15px;">
 2-1) 기타회원은 법인, 외국인 등으로 등록 후 
      코바의 취득, 양도를 할 수 있다.

 2-2) 기본회원 중 천만코바 이상의 코바보유는 
      기타회원 등록으로 보유할 수 있다.

 2-3) 기타회원은 매년말 기준 2%의 보유세를 
      가상정부에 낸다.

 2-4) 소정의 등록 수수료로 등록 된다.
  </pre>
  </h3>
